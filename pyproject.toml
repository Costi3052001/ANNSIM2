[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "safeacd"
version = "0.1.0"
description = "Typed safety constraints for RL-based autonomous cyber defence (ANNSIM 2027 artefact)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["safeacd"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
